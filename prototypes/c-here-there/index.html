<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Piste C · Here &amp; There</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }</script>
</head>
<body>
<div id="stage" aria-label="3D model of the route"></div>
<div id="loading" class="loading"><div><b>Building the model</b><span id="loading-msg">Loading data…</span></div></div>

<section class="card" id="card">
  <header><h1>Piste</h1><p>Prototype C · Here &amp; There · three.js axonometric</p></header>
  <div id="trips" class="trips"></div>
  <label class="row" for="strict"><span>Direct</span><input id="strict" type="range" min="0" max="100" value="85"><span>Bike lanes</span></label>
  <div id="stats" class="stats"></div>
  <div id="gaps" class="gaps"></div>
  <p class="hint">Drag to pan · scroll to zoom · right-drag to turn. Click the model to set the destination, Shift-click for the start.</p>
  <button id="ride" class="go">Ride it</button>
</section>

<section class="dials" aria-label="View">
  <button id="view-btn" class="view-btn" title="Axonometric or top-down"><svg viewBox="0 0 32 32" aria-hidden="true"><g class="flat"><rect x="7" y="7" width="18" height="18" rx="1"/></g><g class="cube"><path d="M16 5 26 10.5v11L16 27 6 21.5v-11z"/><path d="M6 10.5 16 16l10-5.5M16 16v11"/></g></svg><span id="view-label">AXO</span></button>
  <label for="bend">Bend ahead <output id="bend-out"></output></label><input id="bend" type="range" min="0" max="100" value="35">
  <label for="exag">Hills × <output id="exag-out"></output></label><input id="exag" type="range" min="10" max="40" value="18">
  <label class="tick"><input id="shadows" type="checkbox" checked> Shadows</label>
</section>

<div id="hud" class="hud" hidden>
  <div class="turn"><b id="turn-dist">—</b><span id="turn-text"></span></div>
  <div id="gap" class="gap" hidden></div>
  <div class="bar"><div class="prog"><i id="prog"></i></div><span id="remain"></span><button id="r-view" class="btn">View</button><button id="r-speed" class="btn">4×</button><button id="r-pause" class="btn">Pause</button><button id="r-end" class="btn">End</button></div>
</div>

<script src="../shared/router.js"></script>
<script src="../shared/data/graph_study.js"></script>
<script src="../shared/data/network.js"></script>
<script src="../shared/data/pois.js"></script>
<script src="../shared/data/metro.js"></script>
<script src="../shared/data/landcover.js"></script>
<script src="../shared/data/dem_grid.js"></script>
<script src="../shared/data/buildings_packed.js"></script>
<script src="../shared/data/trips.js"></script>
<script src="../shared/common.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
