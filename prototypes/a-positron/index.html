<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Piste</title>
<meta name="theme-color" content="#ffffff">
<!-- installable: on iPhone, Safari > Share > Add to Home Screen opens it full screen like an app -->
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../favicon.ico">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Piste">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=Overpass:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../vendor/maplibre/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map" aria-label="Map"></div>
<canvas id="wind" class="wind-layer" hidden aria-hidden="true"></canvas>

<aside id="panel" class="panel" data-sheet="half">
  <div id="grabber" class="grabber" role="button" tabindex="0" aria-label="Resize panel"><i></i></div>
  <header class="brand" id="brand">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#0095E6"/><path d="M9 21.5 13.2 11h5.6L23 21.5M13.2 11l3 10.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div><h1>Piste</h1><p data-i18n="tagline"></p></div>
  </header>

  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-go" class="tab on" aria-selected="true" data-i18n="tabGo"></button>
    <button type="button" role="tab" id="tab-suggest" class="tab" aria-selected="false" data-i18n="tabSuggest"></button>
  </div>

  <div class="seg suggest-only" role="radiogroup" hidden>
    <label><input type="radio" name="smode" value="classics" checked><span data-i18n="classics"></span></label>
    <label><input type="radio" name="smode" value="custom"><span data-i18n="custom"></span></label>
  </div>

  <section id="classics" class="classics classics-only" hidden>
    <div id="classic-track" class="classic-track"></div>
    <div id="classic-dots" class="classic-dots" aria-hidden="true"></div>
  </section>

  <section class="search go-or-custom" aria-label="Plan a ride">
    <label for="from" class="field-label custom-only" data-i18n="startLabel" hidden></label>
    <div class="field"><span class="pin" aria-hidden="true"><svg viewBox="0 0 64 78"><path d="M32 76c-3-6-22-22-22-42a22 22 0 0 1 44 0c0 20-19 36-22 42z" fill="#0095E6" stroke="#fff" stroke-width="4"/><circle cx="32" cy="33" r="9" fill="#fff"/></svg></span>
      <input id="from" data-i18n-ph="fromPh" autocomplete="off" spellcheck="false">
      <button type="button" class="pick" data-target="from" data-i18n-title="pickFrom"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
    </div>
    <div class="field go-only"><span class="pin" aria-hidden="true"><svg viewBox="0 0 64 78"><path d="M32 76c-3-6-22-22-22-42a22 22 0 0 1 44 0c0 20-19 36-22 42z" fill="#fff" stroke="#0095E6" stroke-width="5"/><circle cx="32" cy="33" r="9" fill="#0095E6"/></svg></span>
      <input id="to" data-i18n-ph="toPh" autocomplete="off" spellcheck="false">
      <button type="button" class="pick" data-target="to" data-i18n-title="pickTo"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
    </div>
    <ul id="suggest" class="suggest" hidden></ul>
  </section>

  <section id="suggest-form" class="suggest-form custom-only" hidden>
    <div class="seg" role="radiogroup">
      <label><input type="radio" name="shape" value="loop" checked><span data-i18n="loopHere"></span></label>
      <label><input type="radio" name="shape" value="oneway"><span data-i18n="oneWay"></span></label>
    </div>
    <div class="pref-row"><label for="km-num" data-i18n="distance"></label>
      <span class="km-box"><input id="km-num" type="number" min="1" max="100" step="1" value="10" inputmode="numeric"> km <output id="km-time"></output></span></div>
    <input id="km" type="range" min="1" max="100" step="1" value="10" aria-label="km">
    <div class="ends"><span>1 km</span><span>100 km</span></div>
    <div class="stop-pick"><span id="stop-label"><span data-i18n="stopOnWay"></span> <em data-i18n="optional"></em></span>
      <div id="stop-chips" class="stop-chips" role="radiogroup" aria-labelledby="stop-label"></div></div>
  </section>

  <section class="prefs go-or-custom">
    <div class="pref-row"><label for="strict" data-i18n="routeStyle"></label><output id="strict-out"></output></div>
    <input id="strict" type="range" min="0" max="100" value="85" step="1">
    <div class="ends"><span data-i18n="mostDirect"></span><span data-i18n="mostLanes"></span></div>
    <div class="pref-checks">
      <label class="check"><input id="hills" type="checkbox"> <span data-i18n="avoidHills"></span></label>
      <label class="check"><input id="avoid-wind" type="checkbox"> <span data-i18n="avoidWind"></span></label>
    </div>
  </section>

  <section id="routes" class="routes" aria-live="polite"></section>
  <section id="detail" class="detail"></section>
  <footer class="credits">Ville de Montréal (CC BY 4.0) · OpenStreetMap contributors · NRCan HRDEM 2023 + 2024 · STM · BIXI · Open-Meteo · ECCC · OpenFreeMap</footer>
</aside>

<div class="map-controls">
  <button type="button" id="view-btn" class="view-btn" data-i18n-title="to3d">
    <svg viewBox="0 0 32 32" aria-hidden="true"><g class="cube"><path d="M16 5 26 10.5v11L16 27 6 21.5v-11z"/><path d="M6 10.5 16 16l10-5.5M16 16v11"/></g><g class="flat"><rect x="7" y="7" width="18" height="18" rx="2"/></g></svg>
    <span id="view-label">3D</span>
  </button>
  <button type="button" id="wx-btn" class="round-btn" aria-pressed="false" data-i18n-title="weatherBtn">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path class="drop" d="M9.5 7.5c2.8 4.1 4.6 6.8 4.6 9a4.6 4.6 0 0 1-9.2 0c0-2.2 1.8-4.9 4.6-9z"/><path class="slash" d="M15.5 25 19 7"/><path d="M20.5 12.5h5.2a2.4 2.4 0 1 0-2.4-2.4M20.5 17h7.3a2.4 2.4 0 1 1-2.4 2.4M20.5 21.5h3.5"/></svg>
  </button>
  <button type="button" id="winter-btn" class="round-btn" aria-pressed="false" data-i18n-title="winterBtn">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4v24M5.6 10l20.8 12M5.6 22l20.8-12M12.6 5.8 16 8.6l3.4-2.8M12.6 26.2 16 23.4l3.4 2.8M4.7 14.4l4.1-1.5L8 8.6M27.3 17.6l-4.1 1.5.8 4.3M4.7 17.6l4.1 1.5-.8 4.3M27.3 14.4l-4.1-1.5.8-4.3"/></svg>
  </button>
  <button type="button" id="lang-btn" class="round-btn lang-btn" data-i18n-title="langBtn">FR</button>
  <button type="button" id="layers-btn" class="ctl-btn" aria-expanded="false" aria-controls="layers" data-i18n="layers"></button>
  <div id="layers" class="layers" hidden>
    <h3 data-i18n="layersMap"></h3>
    <label><input type="checkbox" data-layer="network" checked> <span data-i18n="lyNetwork"></span></label>
    <label><input type="checkbox" data-layer="planned"> <span data-i18n="lyPlanned"></span> <em data-i18n="lyBrowseOnly"></em></label>
    <label><input type="checkbox" data-layer="works" checked> <span data-i18n="lyWorks"></span></label>
    <label><input type="checkbox" data-layer="pois-food" checked> <span data-i18n="lyFood"></span></label>
    <label><input type="checkbox" data-layer="pois-shop" checked> <span data-i18n="lyShops"></span></label>
    <label><input type="checkbox" data-layer="pois-bike" checked> <span data-i18n="lyBike"></span></label>
    <label><input type="checkbox" data-layer="metro" checked> <span data-i18n="lyMetro"></span></label>
    <label><input type="checkbox" data-layer="culture" checked> <span data-i18n="lyCulture"></span></label>
    <label><input type="checkbox" data-layer="buildings" checked> <span data-i18n="lyBuildings"></span></label>
    <h3 data-i18n="layersElev"></h3>
    <label><input type="checkbox" data-layer="tint" checked> <span data-i18n="lyTint"></span></label>
    <label><input type="checkbox" data-layer="relief" checked> <span data-i18n="lyRelief"></span></label>
    <label><input type="checkbox" data-layer="contours" checked> <span data-i18n="lyContours"></span></label>
    <label><input type="checkbox" data-layer="terrain" checked> <span data-i18n="lyTerrain"></span> <em data-i18n="lyIn3d"></em></label>
  </div>
</div>

<div id="wx-card" class="wx-card" hidden aria-live="polite"></div>

<button type="button" id="ride-fab" class="ride-fab" data-i18n="letsRide" hidden></button>

<!-- phones: the search bar being edited moves to the bottom, with the map above it -->
<div id="focus-bar" class="focus-bar" hidden>
  <ul id="focus-suggest" class="focus-suggest" hidden></ul>
  <div class="focus-head">
    <span id="focus-label" class="focus-label"></span>
    <span class="focus-actions">
      <button type="button" id="focus-cancel" class="focus-btn" data-i18n-title="cancel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
      <button type="button" id="focus-ok" class="focus-btn ok" data-i18n-title="accept"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 12.5l4 4 9-9"/></svg></button>
    </span>
  </div>
  <div class="field focus-field"><span id="focus-pin" class="pin" aria-hidden="true"></span><input id="focus-input" autocomplete="off" spellcheck="false" enterkeyhint="done"></div>
  <div class="focus-hint" data-i18n="focusHint"></div>
</div>

<div id="legend" class="legend">
  <details>
    <summary data-i18n="legend"></summary>
    <div class="lg-group"><b data-i18n="lgRoute"></b>
      <span><i class="sw sw-a"></i><span data-i18n="lgProtected"></span></span><span><i class="sw sw-b"></i><span data-i18n="lgPainted"></span></span>
      <span><i class="sw sw-c"></i><span data-i18n="lgShared"></span></span><span><i class="sw sw-gap"></i><span data-i18n="lgNoLane"></span></span>
    </div>
    <div class="lg-group"><b data-i18n="lgNetwork"></b>
      <span class="summer-only"><i class="sw sw-rev"></i>REV</span><span class="summer-only"><i class="sw sw-net"></i><span data-i18n="lgLanes"></span></span>
      <span class="summer-only"><i class="sw sw-plan"></i><span data-i18n="lgPlanned"></span></span>
      <span class="winter-only"><i class="sw sw-4s"></i><span data-i18n="lg4s"></span></span><span class="winter-only"><i class="sw sw-not4s"></i><span data-i18n="lgNot4s"></span></span>
    </div>
    <div class="lg-group"><b data-i18n="lgElev"></b>
      <div class="elev-legend"><i id="elev-ramp" class="elev-ramp"></i><div id="elev-ticks" class="elev-ticks"></div></div>
      <span><i class="sw sw-contour"></i><span data-i18n="lgContours"></span></span>
    </div>
  </details>
</div>

<div id="ride-hud" class="ride-hud" hidden>
  <div class="turn-card"><div id="turn-icon" class="turn-icon" aria-hidden="true"></div><div><b id="turn-dist">—</b><span id="turn-text"></span></div></div>
  <div id="gap-card" class="gap-card" hidden></div>
  <div id="hill-card" class="hill-card" hidden aria-live="polite">
    <div id="hill-spark" class="hill-spark" aria-hidden="true"></div>
    <div class="hill-text"><b id="hill-title"></b><span id="hill-sub"></span></div>
  </div>
  <div class="ride-bar">
    <div class="ride-progress"><div class="progress"><i id="progress"></i></div><span id="ride-remaining">—</span></div>
    <div class="ride-buttons">
      <button type="button" id="ride-sound" class="ctl-btn icon-btn" title="Sound"></button>
      <button type="button" id="ride-view" class="view-btn small" aria-label="Switch view"><svg viewBox="0 0 32 32" aria-hidden="true"><g class="cube"><path d="M16 5 26 10.5v11L16 27 6 21.5v-11z"/><path d="M6 10.5 16 16l10-5.5M16 16v11"/></g><g class="flat"><rect x="7" y="7" width="18" height="18" rx="2"/></g></svg></button>
      <button type="button" id="ride-speed" class="ctl-btn" title="Simulation speed">4×</button>
      <button type="button" id="ride-pause" class="ctl-btn" data-i18n="pause"></button>
      <button type="button" id="ride-exit" class="ctl-btn" data-i18n="end"></button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" hidden></div>

<script src="../vendor/maplibre/maplibre-gl.js"></script>
<script src="../vendor/pmtiles/pmtiles.js"></script>
<script src="../shared/router.js"></script>
<script src="../shared/i18n.js"></script>
<script src="../shared/data/graph_island.js"></script>
<script src="../shared/data/planned.js"></script>
<script src="../shared/data/pois.js"></script>
<script src="../shared/data/elevation_tint.js"></script>
<script src="../shared/data/terrain_index.js"></script>
<script src="../shared/data/trips.js"></script>
<script src="../shared/data/classics.js"></script>
<script src="../shared/common.js"></script>
<script src="../shared/suggest.js"></script>
<script src="../shared/weather.js"></script>
<script src="../shared/bixi.js"></script>
<script src="app.js"></script>
</body>
</html>
