<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Piste B · Métro Noir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../vendor/maplibre/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map" aria-label="Map"></div>

<section id="planner" class="planner" aria-label="Plan a ride">
  <div class="title"><span class="badge">P</span><div><h1>Piste</h1><p>Prototype B · Métro Noir</p></div></div>
  <div class="field"><span class="term from" aria-hidden="true"></span><input id="from" placeholder="From" autocomplete="off" spellcheck="false"></div>
  <div class="field"><span class="term to" aria-hidden="true"></span><input id="to" placeholder="To" autocomplete="off" spellcheck="false"></div>
  <ul id="suggest" class="suggest" hidden></ul>
  <div id="trips" class="trips"></div>
  <div class="strict"><label for="strict">Direct</label><input id="strict" type="range" min="0" max="100" value="85"><label for="strict">Bike lanes</label></div>
</section>

<section id="lines" class="lines" aria-live="polite"></section>

<div class="tools">
  <button id="metro-btn" class="tool" title="View the route as a metro line"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 24 13 17h7l6-6" /><circle cx="6" cy="24" r="2.6"/><circle cx="13" cy="17" r="2.6"/><circle cx="20" cy="17" r="2.6"/><circle cx="26" cy="11" r="2.6"/></svg><span>Metro view</span></button>
  <button id="view-btn" class="tool view" title="Top-down or bird's-eye"><svg viewBox="0 0 32 32" aria-hidden="true"><g class="flat"><rect x="7" y="7" width="18" height="18" rx="2"/></g><g class="cube"><path d="M16 5 26 10.5v11L16 27 6 21.5v-11z"/><path d="M6 10.5 16 16l10-5.5M16 16v11"/></g></svg><span id="view-label">2D</span></button>
  <button id="planned-btn" class="tool" title="Show planned and in-construction bike routes (browse only)"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 25 27 7" stroke-dasharray="3 3"/><path d="M9 9h6M12 6v6"/></svg><span>Planned</span></button>
</div>

<div id="strip" class="strip" hidden>
  <div class="strip-head"><b id="strip-title">Your line</b><span id="strip-meta"></span><button id="ride-btn" class="go">Ride</button></div>
  <div id="strip-svg" class="strip-svg"></div>
</div>

<div id="ride" class="ride" hidden>
  <div class="next"><span id="next-dist">—</span><span id="next-text">Starting</span></div>
  <div id="alert" class="alert" hidden></div>
  <aside id="rail-left" class="rail left" aria-label="On your left"></aside>
  <aside id="rail-right" class="rail right" aria-label="On your right"></aside>
  <div class="ride-ctl"><button id="ride-view" class="tool view small"><svg viewBox="0 0 32 32" aria-hidden="true"><g class="flat"><rect x="7" y="7" width="18" height="18" rx="2"/></g><g class="cube"><path d="M16 5 26 10.5v11L16 27 6 21.5v-11z"/><path d="M6 10.5 16 16l10-5.5M16 16v11"/></g></svg></button><button id="ride-voice" class="pill" aria-pressed="false">Voice off</button><button id="ride-speed" class="pill">4×</button><button id="ride-pause" class="pill">Pause</button><button id="ride-exit" class="pill">End</button></div>
</div>

<div id="metro" class="metro" hidden>
  <div class="metro-top"><b>Metro view</b><span>Your route as a line. Stations are turns; orange is where there's no bike lane.</span><button id="metro-close" class="pill">Back to map</button></div>
  <div id="metro-svg" class="metro-svg"></div>
</div>

<div id="toast" class="toast" role="status" hidden></div>

<script src="../vendor/maplibre/maplibre-gl.js"></script>
<script src="../shared/router.js"></script>
<script src="../shared/data/graph_study.js"></script>
<script src="../shared/data/network.js"></script>
<script src="../shared/data/planned.js"></script>
<script src="../shared/data/pois.js"></script>
<script src="../shared/data/metro.js"></script>
<script src="../shared/data/contours.js"></script>
<script src="../shared/data/hillshade.js"></script>
<script src="../shared/data/buildings_packed.js"></script>
<script src="../shared/data/trips.js"></script>
<script src="../shared/common.js"></script>
<script src="app.js"></script>
</body>
</html>
