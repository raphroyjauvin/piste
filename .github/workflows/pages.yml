# Tests every push, and publishes the site to GitHub Pages only when the tests pass on main.
# The site is built by tools/build_site.py from prototypes/, with the app at the root: https://www.pistemtl.ca/
# (before the custom domain is set: https://www.raphroyjauvin.ca/piste/). Old /a-positron/ links forward to the root.
# If a test fails, the site stays on the last good version and GitHub emails the failed run.
# One-time setup on github.com: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Test and deploy to GitHub Pages

on:
  push:
    branches: ["**"]   # every branch is tested; only main is published
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/shots/package-lock.json
      # Route safety checks: plain Node, about 2 s (tools/check_routes.js)
      - name: Route safety checks
        run: node tools/check_routes.js
      - name: Install the test tools
        working-directory: tools/shots
        run: npm ci
      - name: Build the site
        run: python3 tools/build_site.py
      # Browser tests (tools/shots/test.mjs) on the built site, in the runner's Google Chrome with software WebGL and
      # saved address, weather and BIXI data (tools/shots/fixtures). Then site_check.mjs loads the site at a domain root
      # and under a folder, and checks the old links forward. The servers start in the same step.
      - name: Browser tests
        env:
          PISTE_BROWSER: chrome
          PISTE_FIXTURES: "1"
          PISTE_BROWSER_ARGS: "--use-angle=swiftshader --use-gl=angle"
          PISTE_APP: index.html
        run: |
          mkdir -p /tmp/sub && ln -s "$PWD/_site" /tmp/sub/piste
          python3 tools/serve.py 8765 _site > /tmp/serve.log 2>&1 &
          python3 tools/serve.py 8766 /tmp/sub > /tmp/serve-sub.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8765/index.html && curl -sf -o /dev/null http://127.0.0.1:8766/piste/index.html && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:8766/piste/index.html || { echo "server did not start"; cat /tmp/serve.log /tmp/serve-sub.log; exit 1; }
          cd tools/shots
          npm test
          node site_check.mjs http://127.0.0.1:8765/ http://127.0.0.1:8766/piste/

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        run: python3 tools/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
